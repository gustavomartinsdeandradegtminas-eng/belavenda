<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BelaVenda – Painel</title>
<meta name="description" content="Painel da revendedora BelaVenda: pedidos, clientes, produtos, entregas e relatórios.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c2185b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BelaVenda">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="bv-icons.js"></script>
<script src="bv-seed.js"></script>
<script src="bv-art.js?v=4"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#c2185b;--primary-d:#880e4f;--primary-l:#fce4ec;
  --bg:#fdf4f9;--surface:#fff;--text:#111827;--muted:#6b7280;
  --border:#fce7f3;--border2:#e5e7eb;
  --success:#10b981;--warn:#f59e0b;--danger:#ef4444;--info:#2563eb;
  --sidebar:#1a0a12;--sidebar-hover:#2d1220;--sidebar-active:#c2185b;
  --grad:linear-gradient(135deg,#880e4f 0%,#c2185b 55%,#e91e8c 100%);
}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);display:flex;min-height:100vh}
.bv-display,.logo,h1,h2{font-family:'Playfair Display',Georgia,serif}
/* SIDEBAR */
.sidebar{width:258px;background:linear-gradient(185deg,#220c18 0%,#160810 55%,#1c0a13 100%);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:transform .3s;box-shadow:4px 0 28px rgba(0,0,0,.22);border-right:1px solid rgba(255,255,255,.05)}
.sidebar::before{content:'';position:absolute;inset:0;background:radial-gradient(130% 45% at 0% 0%,rgba(233,30,140,.14),transparent 62%);pointer-events:none;z-index:0}
.sidebar>*{position:relative;z-index:1}
.sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:12px}
.sidebar-logo-mark{width:44px;height:44px;border-radius:13px;background:var(--grad);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 6px 18px rgba(194,24,91,.5),inset 0 1px 0 rgba(255,255,255,.25);font-family:'Playfair Display',Georgia,serif;font-weight:800;color:#fff;font-size:1.3rem;line-height:1}
.sidebar-logo-text h1{color:#fff;font-size:1.35rem;font-weight:800;font-family:'Playfair Display',Georgia,serif;line-height:1.05;letter-spacing:.2px}
.sidebar-logo-text h1 span{background:linear-gradient(120deg,#f48fb1,#e91e8c);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sidebar-logo-text p{color:rgba(255,255,255,.42);font-size:.7rem;margin-top:3px;letter-spacing:.3px}
.sidebar-nav{flex:1;padding:12px;overflow-y:auto}
.nav-section{padding:14px 12px 6px;font-size:.66rem;font-weight:700;color:rgba(255,255,255,.34);text-transform:uppercase;letter-spacing:1.3px}
.nav-item{display:flex;align-items:center;gap:13px;padding:10px 12px;margin:2px 0;border-radius:11px;cursor:pointer;color:rgba(255,255,255,.66);font-size:.9rem;font-weight:500;transition:background .2s,color .2s,transform .15s;text-decoration:none;position:relative}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;transform:translateX(2px)}
.nav-item:hover .nav-item-icon{color:#f48fb1}
.nav-item.active{background:linear-gradient(100deg,rgba(194,24,91,.34),rgba(233,30,140,.13));color:#fff;font-weight:600;box-shadow:0 3px 12px rgba(194,24,91,.24)}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:4px;height:22px;border-radius:0 4px 4px 0;background:var(--grad);box-shadow:0 0 10px rgba(233,30,140,.75)}
.nav-item.active .nav-item-icon{color:#fff}
.nav-item-icon{font-size:1.15rem;width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);transition:color .2s;flex-shrink:0}
.nav-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:11px;background:var(--grad);color:#fff;font-size:.7rem;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(233,30,140,.5)}
.nav-badge.warn{background:linear-gradient(135deg,#d97706,#f59e0b);box-shadow:0 2px 8px rgba(245,158,11,.5)}
.sidebar-footer{padding:14px;border-top:1px solid rgba(255,255,255,.07)}
.user-info{display:flex;align-items:center;gap:11px;margin-bottom:12px;padding:10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06)}
.user-avatar{width:38px;height:38px;border-radius:11px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.85rem;flex-shrink:0;box-shadow:0 3px 10px rgba(194,24,91,.4)}
.user-name{color:#fff;font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.user-sub{color:rgba(255,255,255,.42);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.btn-logout{width:100%;padding:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:9px;color:rgba(255,255,255,.72);cursor:pointer;font-size:.82rem;font-weight:600;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-logout:hover{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.4);color:#fff}
.btn-logout .ic{font-size:.95rem}
/* MAIN */
.main{margin-left:258px;flex:1;display:flex;flex-direction:column;min-height:100vh;position:relative;z-index:1}
/* blobs decorativos de fundo */
body::before{content:'';position:fixed;top:-140px;right:-120px;width:540px;height:540px;border-radius:50%;background:radial-gradient(circle,rgba(233,30,140,.13),transparent 68%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-180px;right:26%;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(124,58,237,.09),transparent 68%);pointer-events:none;z-index:0}
.topbar{background:var(--grad);color:#fff;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 4px 22px rgba(194,24,91,.3);overflow:hidden}
.topbar::after{content:'';position:absolute;inset:0;background:radial-gradient(150% 130% at 100% 0%,rgba(255,255,255,.24),transparent 55%);pointer-events:none}
.topbar>*{position:relative;z-index:1}
.topbar-title{font-size:1.18rem;font-weight:700;color:#fff;font-family:'Playfair Display',Georgia,serif;letter-spacing:.3px}.hamburger{color:#fff!important}
.topbar-actions{display:flex;gap:10px;align-items:center}
.content{padding:28px;flex:1}
/* CARDS / KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px;margin-bottom:28px}
.kpi-card{background:linear-gradient(160deg,#fff 0%,#fff7fb 100%);border-radius:16px;padding:22px;border:1px solid var(--border);position:relative;overflow:hidden;box-shadow:0 2px 4px rgba(136,14,79,.04),0 8px 24px rgba(136,14,79,.06);transition:transform .25s cubic-bezier(.4,0,.2,1),box-shadow .25s;animation:bv-rise .4s ease both}
.kpi-card:hover{transform:translateY(-4px);box-shadow:0 6px 12px rgba(136,14,79,.08),0 20px 44px rgba(136,14,79,.14)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--grad)}
.kpi-card::after{content:'';position:absolute;top:-42px;right:-42px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(233,30,140,.12),transparent 70%);pointer-events:none}
.kpi-label{font-size:.74rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;max-width:calc(100% - 54px)}
.kpi-value{font-size:1.9rem;font-weight:800;color:var(--text);font-family:'Playfair Display',Georgia,serif;line-height:1.1}
.kpi-sub{font-size:.8rem;color:var(--muted);margin-top:6px}
.kpi-icon{position:absolute;top:18px;right:18px;width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,var(--primary-l),#fff);display:flex;align-items:center;justify-content:center;color:var(--primary);box-shadow:inset 0 0 0 1px rgba(194,24,91,.14),0 4px 10px rgba(194,24,91,.1);z-index:1}
.kpi-icon .ic{width:1.45rem;height:1.45rem}
@keyframes bv-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* CARD */
.card{background:var(--surface);border-radius:16px;border:1px solid var(--border);overflow:hidden;margin-bottom:24px;box-shadow:0 2px 4px rgba(136,14,79,.03),0 10px 30px rgba(136,14,79,.05)}
.card-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#fff,#fffafc)}
.card-title{font-size:1.08rem;font-weight:700;color:var(--text);font-family:'Playfair Display',Georgia,serif}
.card-body{padding:24px}
/* TABLE */
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;padding:12px 16px;background:linear-gradient(180deg,#fdf0f6,#fafafa);color:var(--muted);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border)}
td{padding:13px 16px;border-bottom:1px solid #f7f0f4;color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fdf7fa}
/* BUTTONS */
.btn{padding:10px 20px;border-radius:10px;font-size:.88rem;font-weight:600;cursor:pointer;border:none;transition:transform .15s,box-shadow .2s,background .2s,filter .2s,border-color .2s;font-family:inherit;display:inline-flex;align-items:center;gap:7px}
.btn:active{transform:translateY(1px)}
.btn-sm{padding:6px 13px;font-size:.8rem;border-radius:8px}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(194,24,91,.3)}.btn-primary:hover{filter:brightness(1.07);box-shadow:0 7px 20px rgba(194,24,91,.42);transform:translateY(-1px)}
.btn-secondary{background:#fff;color:var(--text);border:1px solid var(--border2)}.btn-secondary:hover{background:var(--bg);border-color:var(--primary-l);color:var(--primary)}
.btn-success{background:var(--success);color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.3)}.btn-success:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-danger{background:var(--danger);color:#fff;box-shadow:0 4px 14px rgba(239,68,68,.3)}.btn-danger:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-icon{background:none;border:none;cursor:pointer;font-size:1rem;padding:4px 8px;border-radius:4px;transition:background .2s;color:var(--muted)}.btn-icon:hover{background:var(--bg);color:var(--text)}
/* BADGE / STATUS */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700}
.badge-novo{background:#e3f2fd;color:#1565c0}
.badge-separando{background:#fff8e1;color:#f57f17}
.badge-em_transito{background:#e8f5e9;color:#2e7d32}
.badge-entregue{background:#e8f5e9;color:#1b5e20}
.badge-cancelado{background:#fce4ec;color:#b71c1c}
.badge-solicitado{background:#e3f2fd;color:#1565c0}
.badge-falhou{background:#fce4ec;color:#b71c1c}
/* FILTER BAR */
.filter-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:8px 18px;border-radius:22px;border:1.5px solid var(--border);background:var(--surface);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s;color:var(--muted)}
.filter-btn:hover{border-color:var(--primary-l);color:var(--primary)}
.filter-btn.active{border-color:transparent;background:var(--grad);color:#fff;box-shadow:0 4px 13px rgba(194,24,91,.32)}
/* FORM */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.83rem;font-weight:600;color:var(--text);margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 13px;border:2px solid var(--border);border-radius:8px;font-size:.9rem;outline:none;transition:border-color .2s;font-family:inherit;background:#fff}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(194,24,91,.13)}
.form-group textarea{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:all .2s}
.modal-overlay.open{opacity:1;visibility:visible}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;transform:translateY(20px);transition:transform .2s}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface)}
.modal-title{font-size:1.05rem;font-weight:700;color:var(--text)}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
/* ALERT */
.alert{padding:12px 16px;border-radius:8px;font-size:.88rem;margin-bottom:16px}
.alert-info{background:#e3f2fd;color:var(--info);border:1px solid #bbdefb}
.alert-success{background:#e8f5e9;color:var(--success);border:1px solid #c8e6c9}
.alert-warn{background:#fff8e1;color:var(--warn);border:1px solid #ffecb3}
.alert-danger{background:#fce4ec;color:var(--danger);border:1px solid #f8bbd9}
/* TOGGLE */
.toggle{position:relative;display:inline-block;width:42px;height:24px}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:24px;transition:.3s}
.toggle-slider:before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
input:checked+.toggle-slider{background:var(--primary)}
input:checked+.toggle-slider:before{transform:translateX(18px)}
/* SEARCH */
.search-box{display:flex;align-items:center;gap:8px;background:var(--bg);border:2px solid var(--border);border-radius:8px;padding:8px 14px;transition:border-color .2s}
.search-box:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(194,24,91,.13)}
.search-box input{border:none;background:transparent;outline:none;font-size:.9rem;flex:1;font-family:inherit}
/* CALCULADORA */
.calc-result{background:var(--bg);border-radius:12px;padding:20px;margin-top:16px}
.calc-row{display:flex;justify-content:space-between;padding:6px 0;font-size:.9rem;color:var(--muted)}
.calc-row.total{font-weight:700;color:var(--text);font-size:1rem;border-top:1px solid var(--border);margin-top:8px;padding-top:12px}
.calc-alert{margin-top:12px;padding:12px 16px;border-radius:8px;font-size:.88rem;font-weight:600}
/* CHART */
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:160px;padding:0 4px}
.bar-wrap{display:flex;flex-direction:column;align-items:center;flex:1;gap:4px}
.bar{width:100%;border-radius:4px 4px 0 0;transition:height .5s;min-height:2px;cursor:pointer;position:relative}
.bar:hover::after{content:attr(title);position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:3px 8px;border-radius:4px;font-size:.75rem;white-space:nowrap}
.bar-label{font-size:.72rem;color:var(--muted);text-align:center}
.bar:hover{filter:brightness(1.08)}
/* META */
.meta-track{height:16px;background:var(--border);border-radius:10px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(136,14,79,.08)}
.meta-fill{height:100%;background:var(--grad);border-radius:10px;transition:width .7s cubic-bezier(.4,0,.2,1);box-shadow:0 2px 8px rgba(194,24,91,.3)}
/* INSIGHTS */
.insights-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.insight{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:13px;background:linear-gradient(160deg,#fff,#fff7fb);border:1px solid var(--border)}
.insight-ic{width:40px;height:40px;border-radius:11px;background:linear-gradient(145deg,var(--primary-l),#fff);display:grid;place-items:center;color:var(--primary);flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(194,24,91,.12)}
.insight-ic .ic{width:1.2rem;height:1.2rem}
.insight-k{font-size:.7rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.insight-v{font-size:1.05rem;font-weight:800;color:var(--text);font-family:'Playfair Display',Georgia,serif;line-height:1.25;word-break:break-word}
.insight-sub{font-size:.72rem;color:var(--muted);margin-top:2px}
@media(max-width:900px){.insights-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.insights-grid{grid-template-columns:1fr}}
/* DETAIL VIEW */
.detail-header{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.back-btn{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--text)}
.back-btn:hover{background:var(--border)}
.order-info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
.order-info-item{background:var(--bg);border-radius:8px;padding:14px}
.order-info-label{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;margin-bottom:4px}
.order-info-value{font-size:.95rem;font-weight:600;color:var(--text)}
/* EMPTY STATE */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:3rem;margin-bottom:12px}
.empty p{font-size:.95rem;margin-bottom:16px}
/* MOBILE */
.hamburger{display:none;background:none;border:none;cursor:pointer;font-size:1.4rem;padding:4px}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .hamburger{display:block}
  .form-row,.form-row-3{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .content{padding:16px}
}
/* WHATSAPP BTN */
.wa-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;background:#25D366;color:#fff;border:none;border-radius:8px;font-size:.88rem;font-weight:600;cursor:pointer;text-decoration:none;transition:background .2s}
.wa-btn:hover{background:#128C7E}
/* Scrollbar */
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}

/* ─── LOJA STATUS ─────────────────────────────────────── */
.loja-status-pill{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;margin:4px 0 6px;font-size:.84rem;font-weight:700;cursor:pointer;transition:all .2s;border:1px solid transparent;user-select:none}
.loja-status-pill.aberta{background:linear-gradient(100deg,rgba(16,185,129,.2),rgba(16,185,129,.08));color:#6ee7b7;border-color:rgba(16,185,129,.35)}
.loja-status-pill.fechada{background:linear-gradient(100deg,rgba(239,68,68,.2),rgba(239,68,68,.08));color:#fca5a5;border-color:rgba(239,68,68,.35)}
.loja-status-pill:hover{transform:translateX(2px);filter:brightness(1.12)}
.status-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;transition:all .3s}
.dot-aberta{background:#34d399;box-shadow:0 0 0 3px rgba(16,185,129,.25),0 0 10px rgba(16,185,129,.55);animation:bv-pulse 2.4s ease-in-out infinite}
.dot-fechada{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.2)}
@keyframes bv-pulse{0%,100%{box-shadow:0 0 0 3px rgba(16,185,129,.25),0 0 10px rgba(16,185,129,.55)}50%{box-shadow:0 0 0 5px rgba(16,185,129,.12),0 0 14px rgba(16,185,129,.75)}}
.loja-toggle-badge{margin-left:auto;font-size:.66rem;background:rgba(255,255,255,.14);padding:3px 9px;border-radius:20px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:rgba(255,255,255,.85)}

/* ─── KPI LOJA STATUS ─────────────────────────────────── */
.kpi-loja{cursor:pointer;border:2px solid transparent!important}
.kpi-loja.aberta{border-color:rgba(16,185,129,.4)!important;background:linear-gradient(160deg,#fff,#f0fdf8)!important}
.kpi-loja.aberta::before{background:linear-gradient(90deg,#10b981,#34d399)}
.kpi-loja.aberta::after{background:radial-gradient(circle,rgba(16,185,129,.15),transparent 70%)}
.kpi-loja.aberta .kpi-icon{background:linear-gradient(145deg,#d1fae5,#fff);color:#10b981;box-shadow:inset 0 0 0 1px rgba(16,185,129,.18),0 4px 10px rgba(16,185,129,.12)}
.kpi-loja.fechada{border-color:rgba(239,68,68,.4)!important;background:linear-gradient(160deg,#fff,#fef2f2)!important}
.kpi-loja.fechada::before{background:linear-gradient(90deg,#ef4444,#f87171)}
.kpi-loja.fechada::after{background:radial-gradient(circle,rgba(239,68,68,.13),transparent 70%)}
.kpi-loja.fechada .kpi-icon{background:linear-gradient(145deg,#fee2e2,#fff);color:#ef4444;box-shadow:inset 0 0 0 1px rgba(239,68,68,.18),0 4px 10px rgba(239,68,68,.12)}

/* ─── IMAGE PICKER ────────────────────────────────────── */
.img-picker-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0 8px}
.img-opt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:10px;border:2px solid var(--border);cursor:pointer;transition:all .18s;background:#fff}
.img-opt:hover{border-color:var(--primary);background:var(--primary-l);transform:scale(1.04)}
.img-opt.selected{border-color:var(--primary);background:var(--primary-l);transform:scale(1.06);box-shadow:0 0 0 2px var(--primary-l)}
.img-opt-em{font-size:1.4rem;line-height:1}
.img-opt-lb{font-size:.6rem;color:var(--muted);text-align:center;line-height:1.2;white-space:nowrap;overflow:hidden;max-width:100%}
.img-preview{width:60px;height:60px;border-radius:12px;background:var(--primary-l);display:flex;align-items:center;justify-content:center;font-size:1.9rem;border:2px solid var(--border);flex-shrink:0;overflow:hidden}
.img-preview img{width:100%;height:100%;object-fit:cover}
.img-custom-row{display:flex;gap:8px;align-items:center;margin-top:4px}
.img-custom-row input{flex:1;padding:8px 12px;border:2px solid var(--border);border-radius:8px;font-size:.83rem;outline:none;font-family:inherit}
.img-custom-row input:focus{border-color:var(--primary)}
.img-upload-btn{padding:8px 12px;background:var(--bg);border:2px solid var(--border);border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:600;white-space:nowrap;transition:all .2s;color:var(--muted)}
.img-upload-btn:hover{border-color:var(--primary);color:var(--primary)}

/* ─── PROD TABLE IMAGE ────────────────────────────────── */
.prod-img-cell{width:34px;height:34px;border-radius:8px;background:var(--primary-l);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;overflow:hidden}
.prod-img-cell img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>

<!-- SIDEBAR -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-mark">B</div>
    <div class="sidebar-logo-text">
      <h1>Bela<span>Venda</span></h1>
      <p>Painel da Revendedora</p>
    </div>
  </div>
  <div class="sidebar-nav">
    <div class="nav-section">Principal</div>
    <a class="nav-item active" onclick="navigate('dashboard')" id="nav-dashboard">
      <span class="nav-item-icon"><svg class="ic"><use href="#ic-bar-chart"/></svg></span> Dashboard
    </a>
    <a class="nav-item" onclick="navigate('pedidos')" id="nav-pedidos">
      <span class="nav-item-icon"><svg class="ic"><use href="#ic-package"/></svg></span> Pedidos

    <div class="nav-section">Cadastros</div>
    <a class="nav-item" onclick="navigate('clientes')" id="nav-clientes">
      <span class="nav-item-icon"><svg class="ic"><use href="#ic-users"/></svg></span> Clientes
    </a>
    <a class="nav-item" onclick="navigate('produtos')" id="nav-produtos">
      <span class="nav-item-icon"><svg class="ic"><use href="#ic-shopping-bag"/></svg></span> Produtos

    </a>
    <a class="nav-item" onclick="navigate('entregas')" id="nav-entregas">
      <span class="nav-item-icon"><svg class="ic"><use href="#ic-truck"/></svg></span> Entregas
    </a>
    <div class="nav-section">Financeiro</div>
    <a class="nav-item" onclick="navigate('relatorios')" id="nav-relatorios">
      <span class="nav-item-icon"><svg class="ic"><use href="#ic-trending-up"/></svg></span> Relatórios
    </a>
    <a class="nav-item" onclick="navigate('calculadora')" id="nav-calculadora">
      <span class="nav-item-icon"><svg class="ic"><use href="#ic-calculator"/></svg></span> Calculadora
    </a>
    <div class="nav-section">Minha Loja</div>
    <div class="loja-status-pill aberta" id="sidebar-loja-status" onclick="toggleLoja()" title="Clique para abrir ou fechar sua loja">
      <div class="status-dot dot-aberta" id="status-dot"></div>
      <span id="status-text">Loja Aberta</span>
      <span class="loja-toggle-badge">alternar</span>
    </div>
    <a class="nav-item" onclick="navigate('avaliacoes')" id="nav-avaliacoes">
      <span class="nav-item-icon"><svg class="ic"><use href="#ic-star"/></svg></span> Avaliações
    </a>
    <a class="nav-item" onclick="openLoja()" id="nav-loja">
      <span class="nav-item-icon"><svg class="ic"><use href="#ic-link"/></svg></span> Ver Catálogo
    </a>
  </div>
  <div class="sidebar-footer">
    <div class="user-info">
      <div class="user-avatar" id="user-avatar">--</div>
      <div>
        <div class="user-name" id="user-name">Carregando...</div>
        <div class="user-sub" id="user-slug"></div>
      </div>
    </div>
    <button class="btn-logout" onclick="logout()"><svg class="ic"><use href="#ic-arrow-right"/></svg> Sair da conta</button>
  </div>
</nav>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <button class="hamburger" onclick="toggleSidebar()"><svg class="ic"><use href="#ic-menu"/></svg></button>
      <span class="topbar-title" id="topbar-title">Dashboard</span>
    </div>
    <div class="topbar-actions" id="topbar-actions"></div>
  </div>
  <div class="content" id="content">
    <div class="empty"><div class="empty-icon"><svg class="ic ic-xl"><use href="#ic-hourglass"/></svg></div><p>Carregando...</p></div>
  </div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Modal</span>
      <button class="btn-icon" onclick="closeModal()"><svg class="ic"><use href="#ic-x"/></svg></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>

<script src="belavenda-api.js"></script>
<script>
// ─── UTILS ───────────────────────────────────────────────
const uid=()=>crypto.randomUUID()
const fmtMoeda=v=>'R$ '+Number(v||0).toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.')
const fmtData=d=>d?new Date(d).toLocaleDateString('pt-BR'):'—'
const fmtDataHora=d=>d?new Date(d).toLocaleString('pt-BR'):'—'
const now=()=>new Date().toISOString()
const mesAtual=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
const slugify=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')

// ─── AUTH ─────────────────────────────────────────────────
const session=JSON.parse(localStorage.getItem('bv_session')||'null')
if(!session){location.replace('login.html');throw new Error('unauthenticated')}
const REV_ID=session.revendedoraId

function logout(){localStorage.removeItem('bv_session');location.href='login.html'}
// URL absoluta do catálogo, baseada na PASTA atual (funciona em /belavenda/ ou na raiz)
function catalogUrl(){return location.origin+location.pathname.replace(/[^/]*$/,'')+'loja.html?slug='+session.slugLoja}
function openLoja(){window.open('loja.html?slug='+session.slugLoja,'_blank')}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}

// ─── DB ───────────────────────────────────────────────────
const DB={
  getRev:()=>{const rs=JSON.parse(localStorage.getItem('bv_revendedoras')||'[]');return rs.find(r=>r.id===REV_ID)||{}},
  getProdos:()=>JSON.parse(localStorage.getItem('bv_produtos_'+REV_ID)||'[]'),
  saveProdos:(d)=>localStorage.setItem('bv_produtos_'+REV_ID,JSON.stringify(d)),
  getClients:()=>JSON.parse(localStorage.getItem('bv_clientes_'+REV_ID)||'[]'),
  saveClients:(d)=>localStorage.setItem('bv_clientes_'+REV_ID,JSON.stringify(d)),
  getPedidos:()=>JSON.parse(localStorage.getItem('bv_pedidos_'+REV_ID)||'[]'),
  savePedidos:(d)=>localStorage.setItem('bv_pedidos_'+REV_ID,JSON.stringify(d)),
  getEntregas:()=>JSON.parse(localStorage.getItem('bv_entregas_'+REV_ID)||'[]'),
  saveEntregas:(d)=>localStorage.setItem('bv_entregas_'+REV_ID,JSON.stringify(d)),
}

// ─── LOJA STATUS ──────────────────────────────────────────
function getLojaSituacao(){
  const r=DB.getRev()
  return r.lojaAberta!==false // default true se campo não existe
}
function toggleLoja(){
  const revs=JSON.parse(localStorage.getItem('bv_revendedoras')||'[]')
  const r=revs.find(x=>x.id===REV_ID)
  if(!r)return
  r.lojaAberta=!getLojaSituacao()
  localStorage.setItem('bv_revendedoras',JSON.stringify(revs))
  updateLojaStatusUI()
  if(currentSection==='dashboard')renderDashboard()
}
function updateLojaStatusUI(){
  const aberta=getLojaSituacao()
  const pill=document.getElementById('sidebar-loja-status')
  const dot=document.getElementById('status-dot')
  const text=document.getElementById('status-text')
  if(!pill)return
  pill.className='loja-status-pill '+(aberta?'aberta':'fechada')
  dot.className='status-dot '+(aberta?'dot-aberta':'dot-fechada')
  text.textContent=aberta?'Loja Aberta':'Loja Fechada'
}

// ─── INIT ─────────────────────────────────────────────────
const rev=DB.getRev()
document.getElementById('user-name').textContent=session.nome
document.getElementById('user-slug').textContent='/loja/'+session.slugLoja
document.getElementById('user-avatar').textContent=session.nome.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()
updateLojaStatusUI()

let currentSection='dashboard'

function navigate(section){
  currentSection=section
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'))
  const el=document.getElementById('nav-'+section)
  if(el)el.classList.add('active')
  const titles={dashboard:'Dashboard',pedidos:'Pedidos',clientes:'Clientes',produtos:'Produtos',entregas:'Entregas',relatorios:'Relatórios',calculadora:'Calculadora de Margem'}
  document.getElementById('topbar-title').textContent=titles[section]||section
  document.getElementById('topbar-actions').innerHTML=''
  const renderers={dashboard:renderDashboard,pedidos:renderPedidos,clientes:renderClientes,produtos:renderProdutos,entregas:renderEntregas,relatorios:renderRelatorios,calculadora:renderCalculadora,avaliacoes:renderAvaliacoes}
  if(renderers[section])renderers[section]()
  atualizarBadgesSidebar()
  if(window.innerWidth<900)document.getElementById('sidebar').classList.remove('open')
}
function atualizarBadgesSidebar(){
  const novos=DB.getPedidos().filter(p=>p.status==='NOVO').length
  const bp=document.getElementById('badge-pedidos')
  if(bp){if(novos>0){bp.textContent=novos;bp.style.display='flex'}else{bp.style.display='none'}}
  const low=DB.getProdos().filter(p=>p.estoque!=null&&p.estoque<=3).length
  const bpr=document.getElementById('badge-produtos')
  if(bpr){if(low>0){bpr.textContent=low;bpr.style.display='flex'}else{bpr.style.display='none'}}
}

// ─── MODAL ────────────────────────────────────────────────
function openModal(title,body,footer=''){
  document.getElementById('modal-title').textContent=title
  document.getElementById('modal-body').innerHTML=body
  document.getElementById('modal-footer').innerHTML=footer
  document.getElementById('modal-overlay').classList.add('open')
}
function closeModal(e){
  if(!e||e.target===document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open')
}

// ─── STATUS BADGES ────────────────────────────────────────
function badge(status){
  const map={NOVO:'badge-novo',SEPARANDO:'badge-separando',EM_TRANSITO:'badge-em_transito',ENTREGUE:'badge-entregue',CANCELADO:'badge-cancelado',SOLICITADO:'badge-solicitado',FALHOU:'badge-falhou'}
  const label={NOVO:'Novo',SEPARANDO:'Separando',EM_TRANSITO:'Em Trânsito',ENTREGUE:'Entregue',CANCELADO:'Cancelado',SOLICITADO:'Solicitado',FALHOU:'Falhou'}
  return `<span class="badge ${map[status]||'badge-novo'}">${label[status]||status}</span>`
}

// ══════════════════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════════════════
let dashPeriodo=30
function renderDashboard(){
  const content=document.getElementById('content')
  const pedidos=DB.getPedidos()
  const clientes=DB.getClients()
  const filtro=calcDashboard(pedidos,clientes,dashPeriodo)
  content.innerHTML=`
    <div class="filter-bar">
      <span style="font-size:.85rem;font-weight:600;color:var(--muted)">Período:</span>
      ${[{l:'Hoje',v:0},{l:'7 dias',v:7},{l:'30 dias',v:30}].map(f=>`
        <button class="filter-btn${dashPeriodo===f.v?' active':''}" onclick="setDashPeriodo(${f.v})">${f.l}</button>
      `).join('')}
    </div>
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Vendas no período</div>
        <div class="kpi-value">${fmtMoeda(filtro.vendas)}</div>
        <div class="kpi-sub">${filtro.qtdPedidos} pedido(s) entregue(s)</div>
        <div class="kpi-icon">${icon('money-bag','ic-xl')}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Lucro estimado</div>
        <div class="kpi-value" style="color:var(--success)">${fmtMoeda(filtro.lucro)}</div>
        <div class="kpi-sub">Margem média: ${filtro.margem}%</div>
        <div class="kpi-icon">${icon('trending-up','ic-xl')}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Clientes ativas</div>
        <div class="kpi-value">${filtro.clientesAtivas}</div>
        <div class="kpi-sub">Nos últimos 90 dias</div>
        <div class="kpi-icon">${icon('users','ic-xl')}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Produtos no catálogo</div>
        <div class="kpi-value">${DB.getProdos().filter(p=>p.visivelCatalogo).length}</div>
        <div class="kpi-sub">de ${DB.getProdos().length} produtos cadastrados</div>
        <div class="kpi-icon">${icon('shopping-bag','ic-xl')}</div>
      </div>
      ${(()=>{const avs=JSON.parse(localStorage.getItem('bv_avaliacoes_'+REV_ID)||'[]');const avg=avs.length?avs.reduce((s,a)=>s+a.estrelas,0)/avs.length:0;return`<div class="kpi-card" onclick="navigate('avaliacoes')" style="cursor:pointer">
        <div class="kpi-label">Avaliação das clientes</div>
        <div class="kpi-value" style="color:#f57f17">${avs.length?avg.toFixed(1)+' '+icon('star'):'—'}</div>
        <div class="kpi-sub">${avs.length?avs.length+' avaliaç'+(avs.length>1?'ões':'ão'):'Sem avaliações ainda'}</div>
        <div class="kpi-icon">${icon('star','ic-xl')}</div>
      </div>`})()}
      ${(()=>{const aberta=getLojaSituacao();return`<div class="kpi-card kpi-loja ${aberta?'aberta':'fechada'}" onclick="toggleLoja()">
        <div class="kpi-label">Status da Loja</div>
        <div class="kpi-value" style="color:${aberta?'var(--success)':'var(--danger)'};font-size:1.35rem">${aberta?icon('dot')+' Aberta':icon('lock')+' Fechada'}</div>
        <div class="kpi-sub">${aberta?'Clientes podem comprar agora':'Vendas pausadas — clique para abrir'}</div>
        <div class="kpi-icon">${aberta?icon('circle-green','ic-xl'):icon('circle-red','ic-xl')}</div>
      </div>`})()}
    </div>
    ${(()=>{
      const ins=insightsDashboard(pedidos)
      const vA=vendasMes(pedidos), vP=vendasMesAnterior(pedidos)
      let mom='—', momCor='var(--muted)'
      if(vP>0){const d=Math.round((vA-vP)/vP*100);mom=(d>=0?'▲ +':'▼ ')+d+'%';momCor=d>=0?'var(--success)':'var(--danger)'}
      else if(vA>0){mom='▲ novo';momCor='var(--success)'}
      return`<div class="card" style="margin-bottom:24px">
        <div class="card-header"><span class="card-title">Destaques do mês</span></div>
        <div class="card-body">
          <div class="insights-grid">
            <div class="insight"><div class="insight-ic">${icon('money-bag')}</div><div><div class="insight-k">Ticket médio</div><div class="insight-v">${fmtMoeda(ins.ticket)}</div></div></div>
            <div class="insight"><div class="insight-ic">${icon('shopping-bag')}</div><div><div class="insight-k">Mais vendido</div><div class="insight-v">${ins.topProd||'—'}</div>${ins.topProd?`<div class="insight-sub">${ins.topQ} un. vendidas</div>`:''}</div></div>
            <div class="insight"><div class="insight-ic">${icon('star')}</div><div><div class="insight-k">Melhor cliente</div><div class="insight-v">${ins.topCli||'—'}</div>${ins.topCli?`<div class="insight-sub">${fmtMoeda(ins.topV)} em compras</div>`:''}</div></div>
            <div class="insight"><div class="insight-ic">${icon('trending-up')}</div><div><div class="insight-k">vs mês anterior</div><div class="insight-v" style="color:${momCor}">${mom}</div><div class="insight-sub">${fmtMoeda(vA)} vs ${fmtMoeda(vP)}</div></div></div>
          </div>
        </div>
      </div>`
    })()}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div class="card">
        <div class="card-header"><span class="card-title">Últimos Pedidos</span><button class="btn btn-sm btn-secondary" onclick="navigate('pedidos')">Ver todos</button></div>
        <div>${renderUltimosPedidosHTML(pedidos)}</div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Link do Catálogo</span></div>
        <div class="card-body">
          <p style="font-size:.88rem;color:var(--muted);margin-bottom:12px">Compartilhe este link com suas clientes para que elas vejam seus produtos e façam pedidos.</p>
          <div style="display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#fff,var(--primary-l));border:1.5px dashed rgba(194,24,91,.35);border-radius:12px;padding:13px 16px;margin-bottom:14px"><span style="color:var(--primary);flex-shrink:0;display:flex">${icon('link','ic-lg')}</span><span style="font-size:.82rem;font-family:ui-monospace,monospace;word-break:break-all;color:var(--primary-d);font-weight:600">${catalogUrl()}</span></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-primary" onclick="openLoja()">Abrir Catálogo</button>
            <button class="btn btn-secondary" onclick="copiarLink()">Copiar Link</button>
            <a class="wa-btn" href="https://wa.me/?text=${encodeURIComponent('Olá! Veja meu catálogo de produtos de beleza: '+catalogUrl())}" target="_blank">WhatsApp</a>
          </div>
        </div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px">
      ${(()=>{
        const meta=getMeta(), vmes=vendasMes(pedidos)
        const pct=meta>0?Math.min(100,Math.round(vmes/meta*100)):0, falta=Math.max(0,meta-vmes)
        return`<div class="card">
          <div class="card-header"><span class="card-title">Meta do Mês</span><button class="btn btn-sm btn-secondary" onclick="setMetaPrompt()">${icon('pencil')} ${meta>0?'Editar':'Definir'}</button></div>
          <div class="card-body">
            ${meta>0?`
              <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px">
                <div><div style="font-size:.76rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px">Vendido este mês</div><div style="font-size:1.7rem;font-weight:800;font-family:'Playfair Display',Georgia,serif;color:var(--primary)">${fmtMoeda(vmes)}</div></div>
                <div style="text-align:right"><div style="font-size:.76rem;color:var(--muted)">Meta</div><div style="font-weight:700;font-size:1.05rem">${fmtMoeda(meta)}</div></div>
              </div>
              <div class="meta-track"><div class="meta-fill" style="width:${pct}%"></div></div>
              <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:.84rem">
                <span style="font-weight:800;color:${pct>=100?'var(--success)':'var(--primary)'}">${pct}%</span>
                <span style="color:var(--muted)">${pct>=100?icon('trophy')+' Meta batida!':'Faltam '+fmtMoeda(falta)}</span>
              </div>`:`
              <div class="empty" style="padding:22px 10px"><div class="empty-icon">${icon('target','ic-xl')}</div><p>Defina uma meta mensal de vendas para acompanhar seu progresso.</p><button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="setMetaPrompt()">Definir meta</button></div>`}
          </div>
        </div>`
      })()}
      ${(()=>{
        const dias=vendas7dias(pedidos), maxV=Math.max(1,...dias.map(d=>d.vendas)), total=dias.reduce((s,d)=>s+d.vendas,0)
        return`<div class="card">
          <div class="card-header"><span class="card-title">Vendas — últimos 7 dias</span><span style="font-size:.84rem;color:var(--primary);font-weight:800">${fmtMoeda(total)}</span></div>
          <div class="card-body">
            ${total>0?`<div class="bar-chart">${dias.map(d=>`<div class="bar-wrap"><div class="bar" style="height:${Math.max(2,Math.round(d.vendas/maxV*120))}px;background:var(--grad)" title="${d.label}: ${fmtMoeda(d.vendas)}"></div><div class="bar-label">${d.label}</div></div>`).join('')}</div>`:`<div class="empty" style="padding:22px 10px"><div class="empty-icon">${icon('bar-chart','ic-xl')}</div><p>Sem vendas entregues nos últimos 7 dias.</p></div>`}
          </div>
        </div>`
      })()}
    </div>
  `
}
function setDashPeriodo(v){dashPeriodo=v;renderDashboard()}

function vendasMes(pedidos){
  const ini=new Date();ini.setDate(1);ini.setHours(0,0,0,0)
  return pedidos.filter(p=>p.status==='ENTREGUE'&&new Date(p.dataCriacao)>=ini).reduce((s,p)=>s+(p.valorTotal||0),0)
}
function vendasMesAnterior(pedidos){
  const ini=new Date();ini.setDate(1);ini.setHours(0,0,0,0)
  const iniPrev=new Date(ini);iniPrev.setMonth(iniPrev.getMonth()-1)
  return pedidos.filter(p=>{if(p.status!=='ENTREGUE')return false;const d=new Date(p.dataCriacao);return d>=iniPrev&&d<ini}).reduce((s,p)=>s+(p.valorTotal||0),0)
}
function insightsDashboard(pedidos){
  const entregues=pedidos.filter(p=>p.status==='ENTREGUE')
  const ticket=entregues.length?entregues.reduce((s,p)=>s+(p.valorTotal||0),0)/entregues.length:0
  const prodQ={}; entregues.forEach(p=>(p.itens||[]).forEach(it=>{const n=it.nome||'—';prodQ[n]=(prodQ[n]||0)+(it.quantidade||1)}))
  let topProd=null,topQ=0; for(const n in prodQ){if(prodQ[n]>topQ){topQ=prodQ[n];topProd=n}}
  const cliT={}; entregues.forEach(p=>{const n=p.clienteNome||'—';cliT[n]=(cliT[n]||0)+(p.valorTotal||0)})
  let topCli=null,topV=0; for(const n in cliT){if(cliT[n]>topV){topV=cliT[n];topCli=n}}
  return{ticket,topProd,topQ,topCli,topV}
}
function vendas7dias(pedidos){
  const lbls=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'], dias=[], map={}
  const key=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
  for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const o={k:key(d),label:lbls[d.getDay()],vendas:0};dias.push(o);map[o.k]=o}
  pedidos.filter(p=>p.status==='ENTREGUE').forEach(p=>{const k=key(p.dataCriacao);if(map[k])map[k].vendas+=p.valorTotal||0})
  return dias
}

function calcDashboard(pedidos,clientes,periodo){
  const agora=new Date()
  const desde=new Date();
  if(periodo===0)desde.setHours(0,0,0,0);
  else desde.setDate(agora.getDate()-periodo)
  const entregues=pedidos.filter(p=>{
    if(p.status!=='ENTREGUE')return false
    const d=new Date(p.dataCriacao)
    return d>=desde
  })
  const vendas=entregues.reduce((s,p)=>s+(p.valorTotal||0),0)
  const lucro=entregues.reduce((s,p)=>s+(p.lucroEstimado||0),0)
  const margem=vendas>0?Math.round(lucro/vendas*100):0
  const qtdPedidos=entregues.length
  const noventa=new Date();noventa.setDate(agora.getDate()-90)
  const clientesAtivas=new Set(pedidos.filter(p=>new Date(p.dataCriacao)>=noventa).map(p=>p.clienteFinalId)).size
  return{vendas,lucro,margem,qtdPedidos,clientesAtivas}
}

function estoqueBadge(e){
  if(e==null)return`<span style="color:var(--muted);font-size:.82rem">— livre</span>`
  if(e===0)return`<span class="badge" style="background:#fee2e2;color:#b91c1c">${icon('alert-triangle')} Esgotado</span>`
  if(e<=3)return`<span class="badge" style="background:#fef3c7;color:#b45309">${e} · acabando</span>`
  return`<span class="badge" style="background:#d1fae5;color:#047857">${e} un.</span>`

  if(!f.length)return`<tr><td colspan="9" style="text-align:center;padding:30px;color:var(--muted)">Nenhum produto encontrado</td></tr>`
  return f.map(p=>{
    const margem=p.precoVenda>0?Math.round((p.precoVenda-p.precoCusto)/p.precoVenda*100):0
    const cor=margem<20?'var(--danger)':margem<35?'var(--warn)':'var(--success)'
    const imgContent=prodImg(p.imagem, p.categoria, p.id||p.nome)
    const estoqueCell=estoqueBadge(p.estoque)
    return`<tr>
      <td>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="prod-img-cell">${imgContent}</div>
          <strong>${p.nome}</strong>
        </div>
      </td>
      <td>${p.marca}</td>
      <td><span style="background:var(--bg);border-radius:6px;padding:2px 8px;font-size:.78rem">${p.categoria}</span></td>
      <td>${fmtMoeda(p.precoCusto)}</td>
      <td><strong>${fmtMoeda(p.precoVenda)}</strong></td>
      <td style="color:${cor};font-weight:700">${margem}%</td>
      <td>${estoqueCell}</td>
      <td>
        <label class="toggle">
          <input type="checkbox" ${p.visivelCatalogo?'checked':''} onchange="toggleCatalogo('${p.id}',this.checked)">
          <span class="toggle-slider"></span>
        </label>
      </td>
      <td style="display:flex;gap:4px">
        <button class="btn-icon" onclick="abrirFormProduto('${p.id}')">${icon('pencil')}</button>
        <button class="btn-icon" onclick="excluirProduto('${p.id}')">${icon('trash')}</button>
      </td>
    </tr>`
  }).join('')
}
function filtrarProdutos(q){
  const produtos=DB.getProdos().filter(p=>p.nome.toLowerCase().includes(q.toLowerCase())||p.marca.toLowerCase().includes(q.toLowerCase()))
  document.getElementById('produtos-tbody').innerHTML=renderProdRows(produtos)

function toggleCatalogo(id,val){
  const prods=DB.getProdos()
  const p=prods.find(x=>x.id===id)

}

function updateImgGrid(cat){
  const opts=PROD_IMGS[cat]||PROD_IMGS['Outros']
  const grid=document.getElementById('img-grid')
  if(!grid)return
  const lbl=document.getElementById('img-cat-label')
  if(lbl)lbl.textContent=cat
  // Se a imagem atual não é URL/base64, reseta para o padrão da nova categoria
  if(_prodImgSel&&!_prodImgSel.startsWith('http')&&!_prodImgSel.startsWith('data:')){
    const isInNewCat=opts.some(o=>o.v===_prodImgSel)
    if(!isInNewCat)_prodImgSel=opts[0].v
  }
  grid.innerHTML=opts.map(o=>`
    <div class="img-opt${_prodImgSel===o.v?' selected':''}" onclick="selectProdImg('${o.v}',this)" title="${o.l}">
      <span class="img-opt-em">${prodImg(o.v, cat, o.v)}</span>
      <span class="img-opt-lb">${o.l}</span>
    </div>
  `).join('')
  // Atualiza preview se nenhum custom
  const urlEl=document.getElementById('img-url')
  if(urlEl&&!urlEl.value){
    const prev=document.getElementById('img-preview')
    if(prev)prev.innerHTML=prodImg(_prodImgSel||opts[0].v, cat, _prodImgSel||opts[0].v)
  }
}

function selectProdImg(v,el){
  _prodImgSel=v
  const urlEl=document.getElementById('img-url')
  if(urlEl)urlEl.value=''
  document.querySelectorAll('.img-opt').forEach(x=>x.classList.remove('selected'))
  if(el)el.classList.add('selected')
  const prev=document.getElementById('img-preview')
  if(prev)prev.innerHTML=prodImg(v, null, v)
}

function previewImgUrl(url){
  if(!url)return
  _prodImgSel=url
  document.querySelectorAll('.img-opt').forEach(el=>el.classList.remove('selected'))
  const prev=document.getElementById('img-preview')
  if(prev)prev.innerHTML=`<img src="${url}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='<svg class=\\'ic ic-xl\\'><use href=\\'#ic-x-circle\\'/></svg>';">`
}

function handleImgUpload(input){
  const file=input.files[0]
  if(!file)return
  if(file.size>600*1024){alert('Imagem muito grande. Use uma imagem até 600KB.');return}
  const reader=new FileReader()
  reader.onload=e=>{
    _prodImgSel=e.target.result
    document.querySelectorAll('.img-opt').forEach(el=>el.classList.remove('selected'))
    const prev=document.getElementById('img-preview')
    if(prev)prev.innerHTML=`<img src="${_prodImgSel}" style="width:100%;height:100%;object-fit:cover">`
    const urlEl=document.getElementById('img-url')
    if(urlEl)urlEl.value=''
  }
  reader.readAsDataURL(file)
}

function calcMargemProd(){
  const custo=parseFloat(document.getElementById('fp-custo')?.value)||0
  const venda=parseFloat(document.getElementById('fp-venda')?.value)||0
  const el=document.getElementById('fp-margem')
  if(!el)return
  if(!custo||!venda){el.style.display='none';return}
  const margem=Math.round((venda-custo)/venda*100)
  const lucro=venda-custo
  el.style.display='block'
  if(lucro<0){el.className='alert alert-danger';el.textContent=`Prejuízo! Você perderia ${fmtMoeda(-lucro)} por unidade vendida`}
  else if(margem<20){el.className='alert alert-warn';el.textContent=`Margem baixa (${margem}%) — Lucro: ${fmtMoeda(lucro)} por unidade`}
  else{el.className='alert alert-success';el.textContent=`Margem saudável (${margem}%) — Lucro: ${fmtMoeda(lucro)} por unidade`}
}

function salvarProduto(id){
  const nome=document.getElementById('fp-nome').value.trim()
  if(!nome){alert('Nome do produto é obrigatório.');return}
  const prods=DB.getProdos()
  const imgUrl=document.getElementById('img-url').value.trim()
  const cat=document.getElementById('fp-cat').value
  const imagem=imgUrl||_prodImgSel||(PROD_IMGS[cat]?.[0]?.v||'lipstick')
  const estoqueRaw=document.getElementById('fp-estoque').value.trim()
  const data={
    nome,
    marca:document.getElementById('fp-marca').value,
    categoria:cat,
    precoCusto:parseFloat(document.getElementById('fp-custo').value)||0,
    precoVenda:parseFloat(document.getElementById('fp-venda').value)||0,
    visivelCatalogo:document.getElementById('fp-vis').checked,
    imagem,
    estoque:estoqueRaw===''?null:Math.max(0,parseInt(estoqueRaw)||0),
  }
  if(id){const p=prods.find(x=>x.id===id);if(p)Object.assign(p,data)}
  else prods.push({id:uid(),revendedoraId:REV_ID,...data,criadoEm:now()})
  DB.saveProdos(prods);closeModal();renderProdutos()
}

function excluirProduto(id){
  if(!confirm('Excluir este produto permanentemente?'))return
  DB.saveProdos(DB.getProdos().filter(p=>p.id!==id));renderProdutos()
}

function abrirNovaEntrega(){
  const pedidos=DB.getPedidos().filter(p=>p.status!=='CANCELADO'&&p.status!=='ENTREGUE')
  openModal('Nova Entrega',`
    <div class="alert alert-info">A entrega será simulada (integração real com Lalamove pode ser adicionada).</div>
    <div class="form-group"><label>Pedido</label>
      <select id="ne-pedido">${pedidos.map(p=>`<option value="${p.id}">#${p.id.slice(0,8).toUpperCase()} – ${p.clienteNome} – ${fmtMoeda(p.valorTotal)}</option>`).join('')||'<option>Nenhum pedido disponível</option>'}</select>
    </div>
    <div class="form-group"><label>Serviço</label>
      <select id="ne-servico"><option>LALAMOVE</option><option>MOTOBOY</option><option>CORREIOS</option><option>ENTREGA_PROPRIA</option></select>
    </div>
  `,`<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="criarEntrega()">Criar Entrega</button>`)
}
function criarEntrega(){
  const pedidoId=document.getElementById('ne-pedido').value
  if(!pedidoId){alert('Selecione um pedido.');return}
  const servico=document.getElementById('ne-servico').value
  const extId='EXT-'+Math.random().toString(36).slice(2,8).toUpperCase()
  const entrega={id:uid(),pedidoId,servico,status:'SOLICITADO',externalId:extId,urlTracking:`https://tracking.simulado.com/${extId}`,criadoEm:now()}
  const entregas=DB.getEntregas();entregas.push(entrega);DB.saveEntregas(entregas)
  const pedidos=DB.getPedidos()
  const p=pedidos.find(x=>x.id===pedidoId)
  if(p&&p.status==='NOVO')p.status='SEPARANDO',DB.savePedidos(pedidos)
  closeModal();renderEntregas()
}
function atualizarEntrega(id){
  const entregas=DB.getEntregas()
  const e=entregas.find(x=>x.id===id)
  if(!e)return
  const opts=['SOLICITADO','EM_TRANSITO','ENTREGUE','FALHOU'].map(s=>`<option value="${s}"${e.status===s?' selected':''}>${{SOLICITADO:'Solicitado',EM_TRANSITO:'Em Trânsito',ENTREGUE:'Entregue',FALHOU:'Falhou'}[s]}</option>`).join('')
  openModal('Atualizar Entrega',`
    <div class="form-group"><label>Status</label><select id="ae-status">${opts}</select></div>
  `,`<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarEntrega('${id}')">Salvar</button>`)
}
function salvarEntrega(id){
  const entregas=DB.getEntregas()
  const e=entregas.find(x=>x.id===id)
  if(e){
    const ns=document.getElementById('ae-status').value
    e.status=ns
    if(ns==='ENTREGUE'){
      const pedidos=DB.getPedidos()
      const p=pedidos.find(x=>x.id===e.pedidoId)
      if(p){p.status='ENTREGUE';p.dataConclusao=now();DB.savePedidos(pedidos)}
    }
    DB.saveEntregas(entregas)
  }
  closeModal();renderEntregas()
}

function renderRelatorios(){
  const pedidos=DB.getPedidos()
  const produtos=DB.getProdos()
  document.getElementById('topbar-actions').innerHTML=''
  // Vendas por mês (últimos 6 meses)
  const meses={}
  for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;meses[k]={vendas:0,lucro:0,label:d.toLocaleString('pt-BR',{month:'short',year:'2-digit'})}}
  pedidos.filter(p=>p.status==='ENTREGUE').forEach(p=>{const k=p.dataCriacao.slice(0,7);if(meses[k]){meses[k].vendas+=p.valorTotal||0;meses[k].lucro+=p.lucroEstimado||0}})
  const mList=Object.values(meses)
  const maxV=Math.max(...mList.map(m=>m.vendas),1)
  // Top produtos
  const prodCount={}
  pedidos.forEach(p=>(p.itens||[]).forEach(it=>{prodCount[it.produtoId]=(prodCount[it.produtoId]||{nome:it.nome,qtd:0,receita:0});prodCount[it.produtoId].qtd+=it.quantidade;prodCount[it.produtoId].receita+=it.precoUnitario*it.quantidade}))
  const topProds=Object.values(prodCount).sort((a,b)=>b.receita-a.receita).slice(0,5)
  // Top clientes
  const cliCount={}
  pedidos.forEach(p=>{const k=p.clienteFinalId;if(k){cliCount[k]=(cliCount[k]||{nome:p.clienteNome,total:0,qtd:0});cliCount[k].total+=p.valorTotal||0;cliCount[k].qtd++}})
  const topClis=Object.values(cliCount).sort((a,b)=>b.total-a.total).slice(0,5)
  const c=document.getElementById('content')
  c.innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
      <div class="card">
        <div class="card-header"><span class="card-title">Vendas por Mês</span></div>
        <div class="card-body">
          <div class="bar-chart">${mList.map(m=>`
            <div class="bar-wrap">
              <div class="bar" style="height:${Math.round(m.vendas/maxV*120)}px;background:var(--primary)" title="${m.label}: ${fmtMoeda(m.vendas)}"></div>
              <div class="bar-label">${m.label}</div>
            </div>`).join('')}
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Lucro por Mês</span></div>
        <div class="card-body">
          <div class="bar-chart">${mList.map(m=>`
            <div class="bar-wrap">
              <div class="bar" style="height:${Math.round(m.lucro/maxV*120)}px;background:var(--success)" title="${m.label}: ${fmtMoeda(m.lucro)}"></div>
              <div class="bar-label">${m.label}</div>
            </div>`).join('')}
          </div>
        </div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
      <div class="card">
        <div class="card-header"><span class="card-title">Top 5 Produtos</span></div>
        ${topProds.length?`<table><thead><tr><th>#</th><th>Produto</th><th>Qtd</th><th>Receita</th></tr></thead><tbody>${
          topProds.map((p,i)=>`<tr><td>${i+1}</td><td>${p.nome}</td><td>${p.qtd}</td><td>${fmtMoeda(p.receita)}</td></tr>`).join('')
        }</tbody></table>`:'<div class="empty" style="padding:30px"><p>Sem dados ainda</p></div>'}
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">Top 5 Clientes</span></div>
        ${topClis.length?`<table><thead><tr><th>#</th><th>Cliente</th><th>Pedidos</th><th>Total</th></tr></thead><tbody>${
          topClis.map((c,i)=>`<tr><td>${i+1}</td><td>${c.nome}</td><td>${c.qtd}</td><td>${fmtMoeda(c.total)}</td></tr>`).join('')
        }</tbody></table>`:'<div class="empty" style="padding:30px"><p>Sem dados ainda</p></div>'}
      </div>
    </div>`
}

// CALCULADORA DE MARGEM
// ══════════════════════════════════════════════════════════
function renderCalculadora(){
  document.getElementById('topbar-actions').innerHTML=''
  document.getElementById('content').innerHTML=`
    <div style="max-width:600px;margin:0 auto">
      <div class="card">
        <div class="card-header"><span class="card-title">Calculadora de Margem de Lucro</span></div>
        <div class="card-body">
          <div class="form-row">
            <div class="form-group">
              <label>Preço de Custo (R$)</label>
              <input type="number" id="c-custo" step="0.01" placeholder="0,00" oninput="calcMargem()">
            </div>
            <div class="form-group">
              <label>Preço de Venda (R$)</label>
              <input type="number" id="c-venda" step="0.01" placeholder="0,00" oninput="calcMargem()">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Frete (R$)</label>
              <input type="number" id="c-frete" step="0.01" placeholder="0,00" value="0" oninput="calcMargem()">
            </div>
            <div class="form-group">
              <label>Taxa BelaVenda (%)</label>
              <input type="number" id="c-taxa" step="0.1" placeholder="0" value="5" oninput="calcMargem()">
            </div>
          </div>
          <div id="c-resultado" class="calc-result" style="display:none">
            <div class="calc-row"><span>Preço de Venda</span><span id="r-venda">—</span></div>
            <div class="calc-row"><span>(-) Custo do Produto</span><span id="r-custo">—</span></div>
            <div class="calc-row"><span>(-) Frete</span><span id="r-frete">—</span></div>
            <div class="calc-row"><span>(-) Taxa BelaVenda</span><span id="r-taxa">—</span></div>
            <div class="calc-row total"><span>= Lucro Líquido</span><span id="r-lucro">—</span></div>
            <div class="calc-row total"><span>Margem de Lucro</span><span id="r-margem">—</span></div>
          </div>
          <div id="c-alert" class="calc-alert" style="display:none"></div>
        </div>
      </div>
      <div class="alert alert-info" style="margin-top:16px">
        <strong>Dica:</strong> Uma margem saudável para cosméticos e perfumes geralmente fica entre 30% e 60%. Abaixo de 20% pode comprometer seu negócio.
      </div>
    </div>`
}
function calcMargem(){
  const custo=parseFloat(document.getElementById('c-custo')?.value)||0
  const venda=parseFloat(document.getElementById('c-venda')?.value)||0
  const frete=parseFloat(document.getElementById('c-frete')?.value)||0
  const taxaPerc=parseFloat(document.getElementById('c-taxa')?.value)||0
  if(!custo&&!venda)return
  const taxa=venda*taxaPerc/100
  const lucro=venda-custo-frete-taxa
  const margem=venda>0?lucro/venda*100:0
  document.getElementById('c-resultado').style.display='block'
  document.getElementById('r-venda').textContent=fmtMoeda(venda)
  document.getElementById('r-custo').textContent='- '+fmtMoeda(custo)
  document.getElementById('r-frete').textContent='- '+fmtMoeda(frete)
  document.getElementById('r-taxa').textContent='- '+fmtMoeda(taxa)+` (${taxaPerc}%)`
  document.getElementById('r-lucro').textContent=fmtMoeda(lucro)
  document.getElementById('r-margem').textContent=margem.toFixed(1)+'%'
  document.getElementById('r-lucro').style.color=lucro<0?'var(--danger)':lucro===0?'var(--warn)':'var(--success)'
  const alertEl=document.getElementById('c-alert')
  alertEl.style.display='block'
  if(lucro<0){alertEl.style.background='#fce4ec';alertEl.style.color='var(--danger)';alertEl.textContent='PREJUÍZO! Você está vendendo abaixo do custo.'}
  else if(margem<15){alertEl.style.background='#fff8e1';alertEl.style.color='var(--warn)';alertEl.textContent='Margem muito baixa. Considere aumentar o preço de venda.'}
  else if(margem<30){alertEl.style.background='#fff8e1';alertEl.style.color='var(--warn)';alertEl.textContent=`Margem razoável (${margem.toFixed(1)}%). Você ganha ${fmtMoeda(lucro)} por unidade.`}
  else{alertEl.style.background='#e8f5e9';alertEl.style.color='var(--success)';alertEl.textContent=`Ótima margem (${margem.toFixed(1)}%)! Lucro de ${fmtMoeda(lucro)} por unidade.`}
}

// AVALIAÇÕES RECEBIDAS
// ══════════════════════════════════════════════════════════
function renderAvaliacoes(){
  document.getElementById('topbar-actions').innerHTML=''
  const avs=JSON.parse(localStorage.getItem('bv_avaliacoes_'+REV_ID)||'[]')
  const avg=avs.length?avs.reduce((s,a)=>s+a.estrelas,0)/avs.length:0
  const fmtStar=n=>icon('star-filled').repeat(Math.round(n))+icon('star').repeat(5-Math.round(n))
  const dist=[5,4,3,2,1].map(n=>({n,count:avs.filter(a=>a.estrelas===n).length}))
  const maxC=Math.max(...dist.map(d=>d.count),1)

  document.getElementById('content').innerHTML=`
    <div style="max-width:700px">
      <!-- KPI RATING -->
      ${avs.length?`
      <div style="display:flex;gap:20px;margin-bottom:24px;flex-wrap:wrap">
        <div class="kpi-card" style="flex:1;min-width:180px">
          <div class="kpi-label">Avaliação média</div>
          <div class="kpi-value" style="color:#f57f17;display:flex;align-items:center;gap:8px">
            ${avg.toFixed(1)} <span style="font-size:1.2rem;letter-spacing:1px;color:#ffc107">${fmtStar(avg)}</span>
          </div>
          <div class="kpi-sub">${avs.length} avaliaç${avs.length>1?'ões':'ão'} recebida${avs.length>1?'s':''}</div>
          <div class="kpi-icon">${icon('star','ic-xl')}</div>
        </div>
        <div class="kpi-card" style="flex:2;min-width:220px">
          <div class="kpi-label">Distribuição de notas</div>
          <div style="margin-top:8px">
            ${dist.map(d=>`
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:.8rem;color:var(--muted)">
              <span style="width:14px;text-align:right">${d.n}</span>
              <span style="color:#ffc107">${icon('star-filled')}</span>
              <div style="flex:1;height:8px;background:#f0f0f0;border-radius:4px;overflow:hidden">
                <div style="width:${Math.round(d.count/maxC*100)}%;height:100%;background:#ffc107;border-radius:4px"></div>
              </div>
              <span style="width:20px">${d.count}</span>
            </div>`).join('')}
          </div>
        </div>
      </div>`:''}

      <!-- LISTA DE AVALIAÇÕES -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">${icon('star')} Avaliações das Clientes</span>
          <span style="font-size:.82rem;color:var(--muted)">${avs.length} no total</span>
        </div>
        ${!avs.length?`<div style="text-align:center;padding:48px 20px;color:var(--muted)">
          <div style="font-size:3rem;margin-bottom:12px">${icon('star','ic-xl')}</div>
          <p style="font-size:.9rem;margin-bottom:6px">Nenhuma avaliação ainda.</p>
          <p style="font-size:.82rem">Quando uma cliente marcar o pedido como entregue e avaliar, aparece aqui.</p>
        </div>`:`
        <table>
          <thead><tr>
            <th>Cliente</th><th>Nota</th><th>Comentário</th><th>Data</th>
          </tr></thead>
          <tbody>
            ${avs.slice().sort((a,b)=>new Date(b.data)-new Date(a.data)).map(a=>`
            <tr>
              <td><strong>${a.clienteNome}</strong><br><span style="font-size:.75rem;color:var(--muted)">${a.clienteWa||''}</span></td>
              <td><span style="color:#ffc107;font-size:1.1rem;letter-spacing:2px">${icon('star-filled').repeat(a.estrelas)}</span><span style="color:#e0e0e0;font-size:1.1rem;letter-spacing:2px">${icon('star').repeat(5-a.estrelas)}</span></td>
              <td style="max-width:280px;font-size:.85rem;color:var(--text)">${a.comentario?`"${a.comentario}"`:'-'}</td>
              <td style="font-size:.8rem;color:var(--muted);white-space:nowrap">${new Date(a.data).toLocaleDateString('pt-BR')}</td>
            </tr>`).join('')}
          </tbody>
        </table>`}
      </div>
    </div>`
}

navigate('dashboard')
</script>
